<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Moonsto Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #0A0A0F;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #1E1E2E;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { font-size: 15px; font-weight: 700; color: #6366F1; }
    .mode-badge {
      font-size: 10px;
      background: rgba(99,102,241,0.15);
      color: #6366F1;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .body { padding: 14px 16px; }

    .site-card {
      background: #12121A;
      border: 1px solid #1E1E2E;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .site-label {
      font-size: 10px;
      color: #4B5563;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .site-name {
      font-weight: 600;
      font-size: 13px;
      color: #F1F5F9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-url {
      font-size: 10px;
      color: #4B5563;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .broker-pill {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(16,185,129,0.15);
      color: #10B981;
    }

    .broker-pill.unknown {
      background: rgba(245,158,11,0.12);
      color: #F59E0B;
    }

    .desc {
      font-size: 11px;
      color: #94A3B8;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .desc ul {
      margin-top: 4px;
      padding-left: 14px;
    }

    .desc li { margin-top: 2px; }

    .btn {
      width: 100%;
      padding: 10px;
      background: #6366F1;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.12s;
    }

    .btn:hover:not(:disabled) { background: #818CF8; }
    .btn:disabled { background: #1E1E2E; color: #4B5563; cursor: not-allowed; }

    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status.success { display:block; background: rgba(16,185,129,0.12); color: #10B981; border: 1px solid rgba(16,185,129,0.25); }
    .status.error   { display:block; background: rgba(239,68,68,0.12);  color: #EF4444;  border: 1px solid rgba(239,68,68,0.25); }
    .status.info    { display:block; background: rgba(99,102,241,0.08); color: #94A3B8;  border: 1px solid #1E1E2E; }

    .divider { border: none; border-top: 1px solid #1E1E2E; margin: 14px 0; }

    .section-title {
      font-size: 10px;
      color: #4B5563;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .capture-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: #12121A;
      border: 1px solid #1E1E2E;
      border-radius: 6px;
      margin-bottom: 5px;
    }

    .capture-broker { font-weight: 600; font-size: 12px; }
    .capture-meta   { font-size: 10px; color: #4B5563; }

    .spinner {
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">moonsto</span>
    <span class="mode-badge">CAPTURE</span>
  </div>

  <div class="body">
    <div class="site-card">
      <div class="site-label">Sitio actual</div>
      <div class="site-name" id="siteName">Cargando...</div>
      <div class="site-url"  id="siteUrl"></div>
      <span class="broker-pill" id="brokerPill" style="display:none"></span>
    </div>

    <p class="desc">
      Guarda una copia de esta página en Firestore para construir el scraper:
      <ul>
        <li>HTML completo del dashboard</li>
        <li>URL y título de la página</li>
        <li>Broker detectado automáticamente</li>
      </ul>
    </p>

    <button class="btn" id="btnCapture">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Capturar página
    </button>

    <div class="status" id="status"></div>

    <div id="historySection" style="display:none">
      <hr class="divider" />
      <div class="section-title">Últimas capturas</div>
      <div id="historyItems"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
